<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Conversor de Números Romanos ↔ Arábigos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Conversor Romano ↔ Arábigo</h1>
    <p>Convierte números romanos a arábigos y viceversa de forma rápida y sencilla.</p>
  </header>

  <main>
    <!-- Bloque Romano → Arábigo -->
    <section class="converter">
      <h2>Romano → Arábigo</h2>
      <input id="romanoInput" type="text" placeholder="Ej: XIV">
      <button id="convertirRomano">Convertir</button>
      <div id="resultadoRomano" class="resultado"></div>
    </section>

    <!-- Bloque Arábigo → Romano -->
    <section class="converter">
      <h2>Arábigo → Romano</h2>
      <input id="arabigoInput" type="number" placeholder="Ej: 2025">
      <button id="convertirArabigo">Convertir</button>
      <div id="resultadoArabigo" class="resultado"></div>
    </section>
  </main>

  <footer>
    <p>Proyecto TP3 · Desplegado en Vercel</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
